<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black">

  <meta
    name="apple-mobile-web-app-title"
    content="Song Caller">

  <meta
    name="theme-color"
    content="#050708">

  <title>Song Caller</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./Song%20Caller_Icon.png?v=3">

  <link
    rel="icon"
    type="image/png"
    href="./Song%20Caller_Icon.png?v=3">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050708;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      text-align: center;
      padding: 30px;
    }

    .icon {
      width: 110px;
      height: 110px;
      border-radius: 25px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: 900;
    }

    .status {
      margin-top: 10px;
      color: #28d17c;
      font-size: 15px;
      font-weight: 700;
    }

    .open {
      display: inline-block;
      margin-top: 28px;
      padding: 15px 22px;
      border-radius: 14px;
      background: #28d17c;
      color: #03130b;
      text-decoration: none;
      font-size: 17px;
      font-weight: 900;
    }
  </style>
</head>

<body>

  <div class="screen">

    <img
      class="icon"
      src="./Song%20Caller_Icon.png"
      alt="Song Caller">

    <div class="title">
      ♪ SONG CALLER
    </div>

    <div class="status">
      LIVE
    </div>

    <a
      class="open"
      href="https://script.google.com/macros/s/AKfycbzoNPeBoOiGNRjqGbBQVZznRKiMfQ4MaUztGjdJaSbHuC_SjFKQ_h4bDRpk9YzyNUfbng/exec">
      APRI SONG CALLER
    </a>

  </div>

</body>
</html>
